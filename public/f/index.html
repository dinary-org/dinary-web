<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>DINARY 위시 폴더</title>
<meta property="og:title" content="DINARY 위시 폴더가 도착했어요">
<meta property="og:description" content="눌러서 DINARY 앱에서 폴더를 열고 내 위시에 담아 보세요.">
<link rel="stylesheet" href="/legal.css">
<!-- Vercel Web Analytics -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
  .open { display: inline-block; margin-top: 28px; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; text-decoration: none; }
  .install { display: inline-block; margin-top: 12px; margin-left: 6px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--ink); color: var(--ink); font-size: 14px; text-decoration: none; }
  .note { margin-top: 18px; color: var(--faint); font-size: 12px; }
</style>
</head>
<body>
<main><div class="wrap">
  <div class="kicker">DINARY</div>
  <h1>DINARY 위시 폴더가 도착했어요</h1>
  <div class="body">
    <p>아래 버튼을 누르면 DINARY 앱에서 이 폴더를 열고, 마음에 드는 가게를 내 위시에 담을 수 있어요.</p>
    <a id="open" class="open" href="#">앱에서 열기</a>
    <a class="install" href="/beta">DINARY 설치하기</a>
    <p class="note" id="note">앱이 열리지 않으면 DINARY 를 먼저 설치하고 로그인한 뒤 이 링크를 다시 눌러 주세요.</p>
  </div>
</div></main>
<script>
(function () {
  // 앱 안의 받은 위시 폴더 화면: dinary://wish/shared?t=<token>
  // 카카오톡 등은 https 링크만 눌리게 보여 주므로, 이 페이지가 중간에서 앱으로 넘겨 줍니다.
  // 폴더 내용은 앱에서만 불러와요(링크를 가진 로그인 사용자). 이 페이지는 토큰을 앱에 건네기만 합니다.
  var t = new URLSearchParams(location.search).get("t") || "";
  if (!/^[0-9a-f]{32}$/.test(t)) {
    document.getElementById("open").style.display = "none";
    document.getElementById("note").textContent = "링크가 올바르지 않아요. 보낸 사람에게 다시 보내 달라고 해 주세요.";
    return;
  }
  var path = "wish/shared?t=" + t;
  var isAndroid = /android/i.test(navigator.userAgent);
  var href = isAndroid
    ? "intent://" + path + "#Intent;scheme=dinary;package=app.dinary;end"
    : "dinary://" + path;
  var a = document.getElementById("open");
  a.href = href;
  // 바로 한 번 열어 보고, 막히면 버튼으로 다시 누르게 둡니다.
  setTimeout(function () { location.href = href; }, 50);
})();
</script>
</body>
</html>
